{% extends "base.html" %}
{% block title %}Ganti Password - {{ site.app_title }}{% endblock %}
{% block heading %}Ganti Password{% endblock %}

{% block content %}
<section class="card form-card">
  <p class="muted">Gunakan password yang kuat (minimal 8 karakter) terutama jika aplikasi
    diakses dari internet.</p>
  <form method="post" class="form-grid">
    <label class="full">Password Saat Ini
      <input type="password" name="current_password" required autocomplete="current-password">
    </label>
    <label class="full">Password Baru
      <input type="password" name="new_password" required minlength="8" autocomplete="new-password">
    </label>
    <label class="full">Ulangi Password Baru
      <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    </label>
    <div class="form-actions full">
      <button class="btn btn-primary" type="submit">Simpan Password</button>
      <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">Batal</a>
    </div>
  </form>
</section>
{% endblock %}
